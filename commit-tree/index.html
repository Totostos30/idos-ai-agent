<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDOS · дерево коммитов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">IDOS / LOCAL REPOSITORY</p>
      <h1>Дерево коммитов</h1>
      <p id="meta" class="muted">Загружаю историю…</p>
    </div>
    <label class="search"><span>Поиск</span><input id="search" type="search" placeholder="hash, ветка, описание"></label>
  </header>
  <main>
    <section id="branches" class="branches" aria-label="Ветки"></section>
    <section class="legend" aria-hidden="true">
      <span><i class="dot"></i>коммит</span>
      <span><i class="ring"></i>слияние</span>
      <span>↕ переход на другую ветку</span>
      <span>→ время</span>
    </section>
    <div id="tree-wrap" class="tree-wrap"><section id="tree" class="tree" aria-live="polite"></section></div>
    <p class="hint">Наведите курсор на точку или нажмите Tab — появится русское описание коммита.</p>
  </main>
  <div id="tooltip" class="graph-tooltip" role="tooltip" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
